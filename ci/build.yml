name: Rootless build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Host regression tests
        run: make test
      - name: Build and inspect rootless package
        run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: iPresence-rootless
          path: packages/*.deb
          if-no-files-found: error
