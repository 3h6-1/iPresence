name: Rootless build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Host regression tests
        run: make test
      # Package builds need a locally licensed Social SDK download.
      # Do not publish the proprietary SDK or linked binaries as CI artifacts.
